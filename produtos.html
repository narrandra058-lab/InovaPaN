<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produtos | InovaPan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/estilo.css">

</head>

<body>

<div class="layout-sistema">

<aside class="sidebar">

<a href="index.html" class="logo-inovapan">

<span class="logo-icon">
<i class="bi bi-cup-hot-fill"></i>
</span>

<span>
<strong>InovaPan</strong>
<small>Gestão de Panificadora</small>
</span>

</a>

<p class="menu-titulo">Menu principal</p>

<a href="dashboard.html" class="menu-link">
<i class="bi bi-grid-1x2-fill"></i>
<span>Dashboard</span>
</a>

<a href="pedidos.html" class="menu-link">
<i class="bi bi-receipt"></i>
<span>Pedidos</span>
</a>

<a href="produtos.html" class="menu-link ativo">
<i class="bi bi-basket2-fill"></i>
<span>Produtos</span>
</a>

<a href="clientes.html" class="menu-link">
<i class="bi bi-people-fill"></i>
<span>Clientes</span>
</a>

<a href="relatorios.html" class="menu-link">
<i class="bi bi-bar-chart-fill"></i>
<span>Relatórios</span>
</a>

<p class="menu-titulo">Sistema</p>

<a href="index.html" class="menu-link">
<i class="bi bi-house-fill"></i>
<span>Página inicial</span>
</a>

</aside>


<main class="conteudo-sistema">

<header class="topbar">

<div class="topbar-titulo">

<strong>Produtos</strong>

<span>Catálogo da panificadora</span>

</div>

<div class="usuario">

<strong>Administrador</strong>

<div class="usuario-avatar">A</div>

</div>

</header>


<div class="pagina-conteudo">

<div class="titulo-pagina d-flex justify-content-between align-items-center">

<div>

<h1>Produtos</h1>

<p>Gerencie os produtos disponíveis para venda.</p>

</div>

<button class="btn btn-principal" data-bs-toggle="modal" data-bs-target="#modalProduto">

<i class="bi bi-plus-lg"></i>
Novo produto

</button>

</div>


<div class="ferramentas">

<div class="campo-busca">

<i class="bi bi-search"></i>

<input
type="text"
id="buscarProduto"
placeholder="Buscar produto..."
>

</div>


<select class="filtro" id="filtroCategoria">

<option value="todos">Todas as categorias</option>
<option value="Pães">Pães</option>
<option value="Bolos">Bolos</option>
<option value="Tortas">Tortas</option>
<option value="Cafés">Cafés</option>
<option value="Chás">Chás</option>
<option value="Sucos">Sucos</option>

</select>

</div>


<div class="produtos-grid" id="listaProdutos"></div>

</div>

</main>

</div>


<div class="modal fade" id="modalProduto">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Novo produto
</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>


<div class="modal-body">

<form id="formProduto">

<div class="mb-3">

<label class="form-label">
Nome do produto
</label>

<input
type="text"
class="form-control"
id="nomeProduto"
required
>

</div>


<div class="mb-3">

<label class="form-label">
Categoria
</label>

<select class="form-select" id="categoriaProduto">

<option>Pães</option>
<option>Bolos</option>
<option>Tortas</option>
<option>Cafés</option>
<option>Chás</option>
<option>Sucos</option>

</select>

</div>


<div class="mb-3">

<label class="form-label">
Preço
</label>

<input
type="number"
step="0.01"
class="form-control"
id="precoProduto"
required
>

</div>

<button class="btn btn-principal w-100">
Cadastrar produto
</button>

</form>

</div>

</div>

</div>

</div>


<div id="toast" class="toast-inovapan"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

</body>
</html>
