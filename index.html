<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InovaPan | Sistema de Gestão</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <div class="container py-5">

        <div class="text-center mb-5">
            <h1 class="fw-bold">InovaPan</h1>

            <p class="text-muted">
                Sistema de Gestão de Pedidos para Panificadora
            </p>
        </div>

        <div class="row g-4">

            <div class="col-md-6 col-lg-3">
                <a href="dashboard.html" class="text-decoration-none">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center">
                            <i class="bi bi-speedometer2 fs-1"></i>
                            <h5 class="mt-3">Dashboard</h5>
                            <p class="text-muted mb-0">
                                Visão geral do sistema
                            </p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-3">
                <a href="clientes.html" class="text-decoration-none">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center">
                            <i class="bi bi-people fs-1"></i>
                            <h5 class="mt-3">Clientes</h5>
                            <p class="text-muted mb-0">
                                Cadastro de clientes
                            </p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-3">
                <a href="produtos.html" class="text-decoration-none">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center">
                            <i class="bi bi-box-seam fs-1"></i>
                            <h5 class="mt-3">Produtos</h5>
                            <p class="text-muted mb-0">
                                Cadastro de produtos
                            </p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-3">
                <a href="pedidos.html" class="text-decoration-none">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center">
                            <i class="bi bi-cart-check fs-1"></i>
                            <h5 class="mt-3">Pedidos</h5>
                            <p class="text-muted mb-0">
                                Registro de pedidos
                            </p>
                        </div>
                    </div>
                </a>
            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/app.js"></script>

</body>
</html>
