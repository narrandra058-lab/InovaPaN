<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | InovaPan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/estilo.css">

</head>

<body>

<div class="layout-sistema">

<aside class="sidebar">

<a href="index.html" class="logo-inovapan">

<span class="logo-icon">
<i class="bi bi-cup-hot-fill"></i>
</span>

<span>
<strong>InovaPan</strong>
<small>Gestão de Panificadora</small>
</span>

</a>

<p class="menu-titulo">Menu principal</p>

<a href="dashboard.html" class="menu-link">
<i class="bi bi-grid-1x2-fill"></i>
<span>Dashboard</span>
</a>

<a href="pedidos.html" class="menu-link">
<i class="bi bi-receipt"></i>
<span>Pedidos</span>
</a>

<a href="produtos.html" class="menu-link">
<i class="bi bi-basket2-fill"></i>
<span>Produtos</span>
</a>

<a href="clientes.html" class="menu-link ativo">
<i class="bi bi-people-fill"></i>
<span>Clientes</span>
</a>

<a href="relatorios.html" class="menu-link">
<i class="bi bi-bar-chart-fill"></i>
<span>Relatórios</span>
</a>

</aside>


<main class="conteudo-sistema">

<header class="topbar">

<div class="topbar-titulo">

<strong>Clientes</strong>

<span>Cadastro e relacionamento</span>

</div>

<div class="usuario">

<strong>Administrador</strong>

<div class="usuario-avatar">A</div>

</div>

</header>


<div class="pagina-conteudo">

<div class="titulo-pagina d-flex justify-content-between align-items-center">

<div>

<h1>Clientes</h1>

<p>Cadastre e gerencie os clientes.</p>

</div>

<button
class="btn btn-principal"
data-bs-toggle="modal"
data-bs-target="#modalCliente"
>

<i class="bi bi-person-plus"></i>
Novo cliente

</button>

</div>


<div class="ferramentas">

<div class="campo-busca">

<i class="bi bi-search"></i>

<input
type="text"
id="buscarCliente"
placeholder="Buscar por nome, telefone ou e-mail..."
>

</div>

</div>


<div class="tabela-container">

<table class="tabela">

<thead>

<tr>

<th>Cliente</th>
<th>Telefone</th>
<th>E-mail</th>
<th>Endereço</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="listaClientes">

</tbody>

</table>

</div>

</div>

</main>

</div>


<div class="modal fade" id="modalCliente">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Novo cliente
</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>


<div class="modal-body">

<form id="formCliente">

<div class="mb-3">

<label class="form-label">
Nome completo
</label>

<input
class="form-control"
id="nomeCliente"
required
>

</div>


<div class="mb-3">

<label class="form-label">
Telefone
</label>

<input
class="form-control"
id="telefoneCliente"
required
>

</div>


<div class="mb-3">

<label class="form-label">
E-mail
</label>

<input
type="email"
class="form-control"
id="emailCliente"
required
>

</div>


<div class="mb-3">

<label class="form-label">
Endereço
</label>

<input
class="form-control"
id="enderecoCliente"
required
>

</div>


<button class="btn btn-principal w-100">

Cadastrar cliente

</button>

</form>

</div>

</div>

</div>

</div>


<div id="toast" class="toast-inovapan"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

</body>
</html>
